[platformio]
default_envs = nm-epd-420-bw

[env:nm-epd-420-bw]
; Match RockBase-iot/NM-EPD-420 platformio.ini (checked 2026-10-07).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = lilygo-t-display-s3
framework = arduino
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.f_cpu = 80000000L
board_build.partitions = huge_app.csv
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
build_flags =
    -DWM_NODEBUG
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    zinggjm/GxEPD2 @ 1.6.8
    adafruit/Adafruit GFX Library @ 1.12.1
    adafruit/Adafruit BusIO @ 1.17.4
    tzapu/WiFiManager @ 2.0.17

; Bounded physical persistence harness, separate from production.
[env:provisioning-persistence-test]
extends = env:nm-epd-420-bw
build_flags =
    ${env:nm-epd-420-bw.build_flags}
    -DPROVISIONING_PERSISTENCE_TEST

; Short cadence for bounded hardware observations; never the production default.
[env:wake-debug]
extends = env:nm-epd-420-bw
build_flags =
    ${env:nm-epd-420-bw.build_flags}
    -DDEBUG_INTERVAL_S=120

[env:native]
platform = native @ 1.2.1
test_framework = unity
test_build_src = yes
build_src_filter = +<schedule.cpp>
build_flags = -std=c++17 -Wall -Wextra -Werror
lib_deps =
test_filter = test_schedule
